# Checks for every change. No secrets are needed: the tests use fake embedders and chat models.
name: CI

on:
  push:
  pull_request:

# A newer run on the same branch or PR makes the older one pointless
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # A test that quietly needs the real embedding model should fail here, not download it
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install # reads backend/.python-version (3.12)
      - run: uv sync --frozen
      - run: uv run pytest # the slow (real model) tests are excluded by default in pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2" # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Placeholders only (the example file). compose v5 builds fine without it, but older
      # compose versions validate env_file on every command, so this keeps the job version-proof.
      - run: cp backend/.env.example backend/.env
      - run: docker compose build
