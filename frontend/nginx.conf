# Serves the built app and proxies /api to the backend (the same job Vite's proxy does in dev).
# Step 21 puts Caddy in front of this container for HTTPS.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The app checks MAX_UPLOAD_MB (20) itself, but only after receiving the whole body
    client_max_body_size 21m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        # Docker's DNS, re-resolved every 10 s: a recreated backend container gets a new IP
        resolver 127.0.0.11 valid=10s;
        set $backend backend:8000;
        # The backend's routes have no /api prefix
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;

        # Overwrite (never append to) the client IP headers, so a client can't send its own
        # X-Forwarded-For and pick the IP the per-IP rate limit sees. Step 21: Caddy sits in front,
        # so switch to `real_ip_header X-Forwarded-For` + `set_real_ip_from <Caddy's address>`,
        # trusting the header from Caddy only.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Answers stream as server-sent events: pass each chunk on as it arrives
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Vite's hashed bundles never change under the same name
    location /assets/ {
        # pdf.js's worker is an .mjs file, which the stock mime.types doesn't cover
        types {
            text/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            image/png png;
            font/woff woff;
            font/woff2 woff2;
            application/wasm wasm;
        }
        default_type application/octet-stream;
        # A location's own add_header drops the server's, so repeat them
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Client-side routes (/w/:id/c/:convId) all load the app shell
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
