[project]
name = "docqa-backend"
version = "0.1.0"
description = "FastAPI backend for the DocQA support agent"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "charset-normalizer>=3.5.2",
    # Exact pin: app/services/vectorstore/__init__.py patches RustBindingsAPI.__init__ to enlarge
    # the HNSW index pool. Recheck that patch (and its guard test) before upgrading.
    "chromadb==1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.40.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "tokenizers>=0.23.3",
    # Direct dependency only so [tool.uv.sources] below can pin where it comes from
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.3",
    "reportlab>=5.1.0",
    "ruff>=0.8",
]

[tool.uv]
# This is an application, not a library: don't build or install it as a package
package = false

# On Linux (Docker, the VPS) take CPU-only torch: the default Linux wheel drags in several GB
# of nvidia-* CUDA packages. Windows and macOS wheels from PyPI are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: downloads and runs the real embedding model (run with: uv run pytest -m slow)",
]

[tool.pyright]
include = ["app", "eval", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
