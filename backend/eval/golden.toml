# --- follow-ups (retrieval uses `standalone`; the answer eval runs the real condense call) --

[[question]]
id = "implant-instalments"
kind = "followup"
style = "literal"
history = [
  { role = "user", content = "How much is a dental implant?" },
  { role = "assistant", content = "A dental implant, including the crown, costs $2,400." },
]
question = "Can I pay for it in instalments?"
standalone = "Can I pay for a dental implant in instalments?"
facts = ['\$200', '12']
sources = [
  { file = "brightsmile-patient-handbook.pdf", section = "4. Payments and refunds" },
  { file = "brightsmile-price-list.docx", section = "Payment and cancellation notes" },
  { file = "brightsmile-faq.txt", section = "Do you offer payment plans?" },
]
answer_eval = true

[[question]]
id = "friday-last-appointment"
kind = "followup"
style = "literal"
history = [
  { role = "user", content = "What are your opening hours on Friday?" },
  { role = "assistant", content = "On Friday the clinic is open from 8:00 am to 4:00 pm." },
]
question = "And when is the last appointment that day?"
standalone = "When does the last appointment start on Friday?"
facts = ['3:30|30 minutes']
sources = [{ file = "brightsmile-patient-handbook.pdf", section = "1. Opening hours" }]

[[question]]
id = "checkup-how-often"
kind = "followup"
style = "literal"
history = [
  { role = "user", content = "How much is a check-up and clean?" },
  { role = "assistant", content = "A check-up and clean costs $95." },
]
question = "How often should I get one?"
standalone = "How often should I get a check-up and clean?"
facts = ['6 months']
sources = [
  { file = "brightsmile-faq.txt", section = "How much is a check-up and clean?" },
  { file = "brightsmile-price-list.docx", section = "Treatments and prices" },
]

[[question]]
id = "whitening-duration"
kind = "followup"
style = "literal"
history = [
  { role = "user", content = "What should I avoid after teeth whitening?" },
  { role = "assistant", content = "Avoid coffee, tea, red wine and other strongly coloured food and drink for 48 hours." },
]
question = "How long does the appointment itself take?"
standalone = "How long does a teeth whitening appointment take?"
facts = ['90']
sources = [
  { file = "brightsmile-price-list.docx", section = "Treatments and prices" },
  { file = "brightsmile-faq.txt", section = "How long does teeth whitening take?" },
]

