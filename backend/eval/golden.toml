# Golden questions over the BrightSmile Dental demo files (backend/demo_data/).
#
# kind:     answerable | followup | unanswerable
# style:    literal (reuses the documents' wording) | paraphrased (how a patient types: synonyms,
#           casual phrasing, typos, no words from the expected section heading) | non-english
# language: en (default) | ar | es | fr; non-english questions are retrieval-only and are left
#           out of the RAG_MIN_SCORE calibration
# facts:    regexes (case-insensitive) that must all appear in the answer
# sources:  any one of these (file, section heading) is a correct retrieval or citation
# topic:    unanswerable only: off (nothing to do with the clinic) | in-domain (about the clinic,
#           but the documents don't say)
# answer_eval: in the small subset the answer eval sends to the real LLM

# --- answerable, literal ------------------------------------------------------------------

[[question]]
id = "hours-saturday"
kind = "answerable"
style = "literal"
question = "What are your opening hours on Saturday?"
facts = ['9(:00)?\s*am', '1(:00)?\s*pm']
sources = [{ file = "brightsmile-patient-handbook.pdf", section = "1. Opening hours" }]
answer_eval = true

[[question]]
id = "cancel-fee"
kind = "answerable"
style = "literal"
question = "How much is the late cancellation fee?"
facts = ['\$40']
sources = [
  { file = "brightsmile-patient-handbook.pdf", section = "2. Booking and cancellations" },
  { file = "brightsmile-price-list.docx", section = "Payment and cancellation notes" },
  { file = "brightsmile-faq.txt", section = "Can I cancel or move my appointment?" },
]
answer_eval = true

[[question]]
id = "insurers"
kind = "answerable"
style = "literal"
question = "Which insurance companies are you in network with?"
facts = ['Northwind', 'Harbor Mutual']
sources = [
  { file = "brightsmile-patient-handbook.pdf", section = "3. Insurance" },
  { file = "brightsmile-faq.txt", section = "Do you accept my insurance?" },
]

[[question]]
id = "payment-methods"
kind = "answerable"
style = "literal"
question = "What payment methods do you accept?"
facts = ['cash', 'bank transfer']
sources = [{ file = "brightsmile-patient-handbook.pdf", section = "4. Payments and refunds" }]

[[question]]
id = "emergency-weekend"
kind = "answerable"
style = "literal"
question = "Who do I call for a dental emergency at the weekend?"
facts = ['555-0199']
sources = [
  { file = "brightsmile-patient-handbook.pdf", section = "5. Dental emergencies" },
  { file = "brightsmile-faq.txt", section = "I have toothache at the weekend. What should I do?" },
]

[[question]]
id = "whitening-price"
kind = "answerable"
style = "literal"
question = "How much does teeth whitening cost?"
facts = ['\$350']
sources = [
  { file = "brightsmile-price-list.docx", section = "Treatments and prices" },
  { file = "brightsmile-faq.txt", section = "How long does teeth whitening take?" },
]

[[question]]
id = "first-visit"
kind = "answerable"
style = "literal"
question = "What should I bring to my first visit?"
facts = ['photo ID', 'insurance card']
sources = [{ file = "brightsmile-faq.txt", section = "What should I bring to my first visit?" }]

[[question]]
id = "address"
kind = "answerable"
style = "literal"
question = "Where is the clinic?"
facts = ['48 Larkspur']
sources = [
  { file = "brightsmile-faq.txt", section = "Where is the clinic?" },
  { file = "brightsmile-patient-handbook.pdf", section = "BrightSmile Dental Patient Handbook" },
]

